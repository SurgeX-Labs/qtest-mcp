apiVersion: apps/v1
kind: Deployment
metadata:
  name: qtest-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qtest-mcp-server
  template:
    metadata:
      labels:
        app: qtest-mcp-server
    spec:
      containers:
        - name: qtest-mcp-server
          image: image-registry.openshift-image-registry.svc:5000/qtest-mcp/qtest-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qtest-mcp-config
            - secretRef:
                name: qtest-mcp-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
