<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>qTest MCP Token Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    label { display:block; margin-top: 16px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 6px; }
    button { margin-top: 20px; padding: 12px 18px; cursor: pointer; }
    textarea { width: 100%; height: 180px; margin-top: 16px; }
    .note { background: #f6f6f6; padding: 12px; border-radius: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>qTest MCP Token Portal</h1>
  <p>Enter your qTest credentials once to generate a personal MCP token. Your password is not stored.</p>

  <label>qTest Username</label>
  <input id="username" autocomplete="username" />

  <label>qTest Password</label>
  <input id="password" type="password" autocomplete="current-password" />

  <button onclick="generateToken()">Generate Personal MCP Token</button>

  <div class="note">
    Use this token in AI clients that support remote MCP servers using:
    <pre>Authorization: Bearer &lt;token&gt;</pre>
  </div>

  <textarea id="result" readonly placeholder="Your token will appear here"></textarea>

  <script>
    async function generateToken() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      result.value = "Generating token...";

      const response = await fetch("/api/auth/generate-token", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
      });

      const data = await response.json();
      if (!response.ok) {
        result.value = "Error: " + JSON.stringify(data, null, 2);
        return;
      }

      result.value = data.personal_mcp_token;
    }
  </script>
</body>
</html>
